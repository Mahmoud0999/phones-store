<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Sharkawy Phones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-section">
                <h1 class="logo">SHAR<span class="logo-phone">📱</span>AWY</h1>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="the best selling.html">Best Selling</a></li>
                <li><a href="accessories.html">Accessories</a></li>
                <li><a href="Returnpolicy.html">Return Policy</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
            <div class="cart-icon" title="Shopping Cart">
                🛒
                <span id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <main class="product-page">
        <div class="product-detail-card" id="product-detail-card">
            <div class="product-detail-image">
                <img id="product-detail-image" src="images/iphone 16 pro.jpeg" alt="Product image">
            </div>
            <div class="product-detail-info">
                <span class="badge">Premium Pick</span>
                <h1 id="product-detail-name">Product Name</h1>
                <p class="product-detail-price" id="product-detail-price">EGP 0</p>
                <p class="product-detail-description" id="product-detail-description">Product description.</p>

                <div class="quantity-box">
                    <span>Quantity</span>
                    <div class="quantity-control">
                        <button type="button" id="decrease-qty" class="qty-btn">-</button>
                        <input type="number" id="product-quantity" value="1" min="1" readonly>
                        <button type="button" id="increase-qty" class="qty-btn">+</button>
                    </div>
                </div>

                <div class="specs-box">
                    <h3>Device Specifications</h3>
                    <ul id="product-specs"></ul>
                </div>

                <div class="product-detail-actions">
                    <a href="index.html" class="cart-btn">Back to Store</a>
                    <button class="buy-now-btn" id="buy-now-btn">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Shopping Cart</h2>
                <span class="close-cart">&times;</span>
            </div>
            <div id="cart-items-list" class="cart-items"></div>
            <div class="modal-footer">
                <div class="cart-summary">
                    <span>Total:</span>
                    <span id="cart-total">0.00 EGP</span>
                </div>
                <button class="checkout-btn" onclick="cart.checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="shopping.js"></script>
    <script>
        function loadProductDetails() {
            const product = JSON.parse(localStorage.getItem('sharkawySelectedProduct') || '{}');
            const imageEl = document.getElementById('product-detail-image');
            const nameEl = document.getElementById('product-detail-name');
            const priceEl = document.getElementById('product-detail-price');
            const descEl = document.getElementById('product-detail-description');
            const specsList = document.getElementById('product-specs');
            const buyBtn = document.getElementById('buy-now-btn');
            const quantityInput = document.getElementById('product-quantity');
            const decreaseBtn = document.getElementById('decrease-qty');
            const increaseBtn = document.getElementById('increase-qty');

            if (!product || !product.name) {
                window.location.href = 'index.html';
                return;
            }

            let selectedQuantity = 1;

            imageEl.src = product.image || 'images/iphone 16 pro.jpeg';
            imageEl.alt = product.name;
            nameEl.textContent = product.name;
            priceEl.textContent = product.price ? `${Number(product.price).toFixed(2)} EGP` : 'Price not available';
            descEl.textContent = product.description || 'Premium product from Sharkawy Phones.';

            const specs = Array.isArray(product.specs) && product.specs.length > 0
                ? product.specs
                : [
                    'Display: Premium modern display',
                    'Performance: Fast and efficient processing',
                    'Camera: High-quality camera system',
                    'Battery: Long-lasting power'
                ];

            specsList.innerHTML = specs.map(spec => `<li>${spec}</li>`).join('');

            decreaseBtn.addEventListener('click', () => {
                selectedQuantity = Math.max(1, selectedQuantity - 1);
                quantityInput.value = selectedQuantity;
            });

            increaseBtn.addEventListener('click', () => {
                selectedQuantity += 1;
                quantityInput.value = selectedQuantity;
            });

            buyBtn.addEventListener('click', () => {
                const cart = JSON.parse(localStorage.getItem('sharkawyCart') || '[]');
                const quantity = Number(quantityInput.value) || 1;
                const existing = cart.find(item => item.name === product.name);

                if (existing) {
                    existing.quantity += quantity;
                } else {
                    cart.push({ ...product, id: Date.now(), quantity });
                }

                localStorage.setItem('sharkawyCart', JSON.stringify(cart));
                if (window.cart) {
                    window.cart.cart = cart;
                    window.cart.updateCartUI();
                }
                window.location.href = 'index.html';
            });
        }

        document.addEventListener('DOMContentLoaded', loadProductDetails);
    </script>
</body>
</html>
